      - name: Verify APK signing, identity and v0.4 features
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$TOOLS/apksigner" verify --verbose "$APK"
          "$TOOLS/aapt" dump badging "$APK" > /tmp/ge-v04-badging.txt
          grep -F "package: name='com.pvzge.gardendless.mobilev04'" /tmp/ge-v04-badging.txt
          git diff --exit-code -- app/src/main/java/com/pvzge/gardendless/PerformanceMode.kt app/src/main/java/com/pvzge/gardendless/RenderSize.kt
          python3 - <<'PYVERIFY04'
          from pathlib import Path
          import hashlib, zipfile
          apk=Path("app/build/outputs/apk/debug/app-debug.apk")
          root=Path("app/src/main/java/com/pvzge/gardendless")
          touch=(root/"MouseGameWebView.kt").read_text()
          activity=(root/"GameActivity.kt").read_text()
          aspect=(root/"AspectRatioFrameLayout.kt").read_text()
          performance=(root/"PerformanceMode.kt").read_text()
          assert 'Gesture.SEED_DRAG' in touch
          assert 'dispatchPointer("hover", event.x, event.y)' in touch
          assert 'dispatchPointer("click", event.x, event.y)' in touch
          assert 'installMobileShovelButton()' in activity
          assert 'dispatchPointer("right", event.x, event.y)\n                            setShovelMode(false)' in touch
          assert 'child.scaleX = s' in aspect and 'child.scaleY = s' in aspect
          assert 'val s = minOf(sx, sy)' in aspect
          assert 'ORIGINAL(60, 0,' in performance
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None, "APK ZIP integrity failed"
              assert z.getinfo("assets/pvzge_web.zip").file_size > 1000000000
              dex=b"".join(z.read(n) for n in z.namelist() if n.endswith(".dex"))
              for marker in (b"SEED_DRAG",b"installMobileShovelButton",b"shovelModeEnabled",b"GEAndroidTouch",b"ORIGINAL"):
                  assert marker in dex, f"Compiled DEX marker missing: {marker}"
          h=hashlib.sha256()
          with apk.open("rb") as f:
              for chunk in iter(lambda:f.read(1024*1024),b""):h.update(chunk)
          print("APK verification passed: package, signing, ZIP integrity, bundled game assets and compiled feature markers.")
          print("Source checks passed: mobile seed gesture, one-shot shovel, uniform aspect scale, unchanged Original rendering option.")
          print("Physical-device gameplay is NOT tested; seed-bank detection is heuristic.")
          print("APK bytes:",apk.stat().st_size)
          print("APK SHA256:",h.hexdigest())
          Path("app/build/outputs/apk/debug/GE-v04.apk.sha256").write_text(h.hexdigest()+"  app-debug.apk\n")
          PYVERIFY04
