      - name: Add mobile-style shovel tool (v0.4)
        shell: bash
        run: |
          cat > /tmp/ge_mobile_shovel_v04.py <<'PYSHOVEL04'
          #!/usr/bin/env python3
          """Additional v0.4 patch after v0.3. Replaces long-press-to-shovel for normal use
          with a visible mobile-style 'shovel then tap lawn' control.
          This does not modify the Cocos game engine; it sends the documented right-click
          shovel action where the user taps.
          """
          from pathlib import Path
          
          root = Path.cwd()
          
          def replace_exact(rel, before, after):
              p = root / rel
              s = p.read_text(encoding='utf-8')
              count=s.count(before)
              if count!=1:
                  raise RuntimeError(f'Expected one exact match, got {count} in {rel}: {before[:80]!r}')
              p.write_text(s.replace(before,after,1),encoding='utf-8')
              print(f'Patched {rel}')
          
          rel_touch='app/src/main/java/com/pvzge/gardendless/MouseGameWebView.kt'
          rel_activity='app/src/main/java/com/pvzge/gardendless/GameActivity.kt'
          
          replace_exact(rel_touch,
          '''    private var gesture = Gesture.IDLE
          ''',
          '''    private var gesture = Gesture.IDLE
          
              // The on-screen shovel is a one-shot tool, like mobile PvZ.
              // The game currently exposes shovel by right mouse button on a lawn tile.
              var onShovelModeChanged: ((Boolean) -> Unit)? = null
              var shovelModeEnabled: Boolean = false
                  private set
          
              fun setShovelMode(enabled: Boolean) {
                  if (shovelModeEnabled == enabled) return
                  shovelModeEnabled = enabled
                  onShovelModeChanged?.invoke(enabled)
              }
          ''')
          replace_exact(rel_touch,
          '''                mainHandler.postDelayed(longPressJob, longPressMs)''',
          '''                if (!shovelModeEnabled) mainHandler.postDelayed(longPressJob, longPressMs)''')
          replace_exact(rel_touch,
          '''                    if (gesture == Gesture.PENDING && hypot(x - downX, y - downY) >= slop) {
                                  mainHandler.removeCallbacks(longPressJob)
                                  if (isLikelySeedPacket(downX, downY)) {''',
          '''                    if (gesture == Gesture.PENDING && hypot(x - downX, y - downY) >= slop && !shovelModeEnabled) {
                                  mainHandler.removeCallbacks(longPressJob)
                                  if (isLikelySeedPacket(downX, downY)) {''')
          replace_exact(rel_touch,
          '''                    Gesture.PENDING -> dispatchPointer("click", event.x, event.y)''',
          '''                    Gesture.PENDING -> {
                                  if (shovelModeEnabled) {
                                      // Tap the target plant once; native wrapper converts to the
                                      // game's right-button shovel command at the precise tile.
                                      dispatchPointer("right", event.x, event.y)
                                      setShovelMode(false)
                                  } else {
                                      dispatchPointer("click", event.x, event.y)
                                  }
                              }''')
          replace_exact(rel_touch,
          '''                    Gesture.TWO_FINGER -> if (!scrollMoved) {
                                  dispatchPointer("right", lastCenterX, lastCenterY)
                              }''',
          '''                    Gesture.TWO_FINGER -> if (!scrollMoved) {
                                  dispatchPointer("right", lastCenterX, lastCenterY)
                                  if (shovelModeEnabled) setShovelMode(false)
                              }''')
          
          # Native TextView button: unlike injected HTML, it remains tappable because the
          # touch adapter intercepts and consumes touch events *inside* the WebView.
          replace_exact(rel_activity,
          '''        setContentView(aspectContainer)
          ''',
          '''        setContentView(aspectContainer)
                  installMobileShovelButton()
          ''')
          replace_exact(rel_activity,
          '''    private fun setupBackNavigation() {''',
          '''    /** Touch-first shovel UI: tap shovel -> tap a planted lawn tile -> auto-exit. */
              private fun installMobileShovelButton() {
                  val touch = webView as MouseGameWebView
                  val scale = resources.displayMetrics.density
                  fun dp(n: Int): Int = (n * scale + 0.5f).toInt()
                  val button = TextView(this).apply {
                      text = "🪏 铲子"
                      textSize = 14f
                      setTextColor(android.graphics.Color.WHITE)
                      setPadding(dp(12), dp(7), dp(12), dp(7))
                      gravity = android.view.Gravity.CENTER
                      contentDescription = "铲子：点一次启用，再点植物铲除；再次点击取消"
                      isClickable = true
                      isFocusable = true
                      elevation = dp(4).toFloat()
                  }
                  fun refresh(enabled: Boolean) {
                      button.text = if (enabled) "✓ 铲子" else "🪏 铲子"
                      button.background = android.graphics.drawable.GradientDrawable().apply {
                          cornerRadius = dp(12).toFloat()
                          setColor(if (enabled) 0xFF338C48.toInt() else 0xCC263238.toInt())
                          setStroke(dp(1), if (enabled) 0xFFB9F6CA.toInt() else 0x99FFFFFF.toInt())
                      }
                  }
                  touch.onShovelModeChanged = { enabled -> refresh(enabled) }
                  button.setOnClickListener { touch.setShovelMode(!touch.shovelModeEnabled) }
                  val params = android.widget.FrameLayout.LayoutParams(
                      android.widget.FrameLayout.LayoutParams.WRAP_CONTENT,
                      android.widget.FrameLayout.LayoutParams.WRAP_CONTENT,
                      android.view.Gravity.TOP or android.view.Gravity.END
                  ).apply {
                      topMargin = dp(65) // below the game's top-right pause button
                      marginEnd = dp(12)
                  }
                  aspectContainer.addView(button, params)
                  refresh(false)
              }
          
              private fun setupBackNavigation() {''')
          # Version label is a freeform Android string override (only in test build).
          replace_exact('app/src/main/AndroidManifest.xml',
          'android:label="GE 手机触控测试版 v0.3"',
          'android:label="GE 手机触控+铲子 v0.4"')
          
          print('v0.4 mobile shovel: on-screen toggle, next tap sends right-click shovel, auto-resets.')
          PYSHOVEL04
          python3 -m py_compile /tmp/ge_mobile_shovel_v04.py
          python3 /tmp/ge_mobile_shovel_v04.py
          grep -q 'installMobileShovelButton()' app/src/main/java/com/pvzge/gardendless/GameActivity.kt
          grep -q 'shovelModeEnabled' app/src/main/java/com/pvzge/gardendless/MouseGameWebView.kt
      - name: Download game assets
        run: |
          # Reuse the exact upstream v0.16.1 bundle while its source repository is unavailable.
          curl --fail --location --retry 3 --output /tmp/ge-original.apk https://github.com/MrPurple666/pvzge-android/releases/download/v0.16.1/app-release.apk
          echo "d1ce5072ff036884d4333f5bf0988e8e533a9d9c9710330a467329521e4f8b35  /tmp/ge-original.apk" | sha256sum --check
          python3 - <<'PYASSETS'
          from pathlib import Path
          import shutil, zipfile
          target = Path("app/src/main/assets/pvzge_web.zip")
          target.parent.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile("/tmp/ge-original.apk") as apk:
              with apk.open("assets/pvzge_web.zip") as source, target.open("wb") as dest:
                  shutil.copyfileobj(source, dest)
          with zipfile.ZipFile(target) as bundle:
              names = bundle.namelist()
              assert "index.html" in names, "Game entry point missing"
              assert any(name.startswith("assets/") for name in names), "Game resources missing"
              print(f"Recovered original v0.16.1 game bundle: {target.stat().st_size} bytes, {len(names)} entries")
          PYASSETS
          rm /tmp/ge-original.apk
