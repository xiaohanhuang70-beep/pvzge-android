name: GE v053 range3x3 resource inspection
'on':
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Recover pinned original APK and inspect exact plant assets
      run: "set -euo pipefail\ncurl --fail --location --retry 3 --output /tmp/ge-original.apk\
        \ https://github.com/MrPurple666/pvzge-android/releases/download/v0.16.1/app-release.apk\n\
        echo \"d1ce5072ff036884d4333f5bf0988e8e533a9d9c9710330a467329521e4f8b35  /tmp/ge-original.apk\"\
        \ | sha256sum --check\npython3 - <<'PYASSETS'\nimport zipfile, shutil, json,\
        \ hashlib\nfrom pathlib import Path\nPath('range-results').mkdir()\nwith zipfile.ZipFile('/tmp/ge-original.apk')\
        \ as apk:\n with apk.open('assets/pvzge_web.zip') as s,open('/tmp/game.zip','wb')\
        \ as d: shutil.copyfileobj(s,d)\nwith zipfile.ZipFile('/tmp/game.zip') as\
        \ z:\n matches=[]\n for name in z.namelist():\n  if not name.endswith('.json'):\
        \ continue\n  data=z.read(name)\n  if any(k in data.lower() for k in [b'missiletoe',b'bananalauncher',b'banana@']):\n\
        \   target=Path('range-results')/name;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)\n\
        \   matches.append({'path':name,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})\n\
        \ print(json.dumps(matches,indent=2))\n Path('range-results/matches.json').write_text(json.dumps(matches,indent=2))\n\
        PYASSETS\n"
    - uses: actions/upload-artifact@v4
      with:
        name: GE-range3x3-original-configs
        path: range-results/
        retention-days: 14
